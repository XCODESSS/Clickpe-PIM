[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickpe-pim"
version = "0.1.0"
description = "Evidence-first monitor for public ClickPe loan product information"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests>=2.32.5,<3",
  "beautifulsoup4>=4.12.3,<5",
  "pydantic>=2.12.5,<3",
  "PyYAML>=6.0.2,<7",
  "pandas>=2.3.3,<3",
  "pyarrow>=20,<24",
  "streamlit>=1.52.1,<2",
  "plotly>=6,<7",
  "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]
browser = ["playwright>=1.55,<2"]
pdf = ["pypdf>=6,<7", "reportlab>=4,<5"]

[project.scripts]
clickpe-pim = "clickpe_pim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clickpe_pim = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--basetemp=.artifacts/pytest"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]
