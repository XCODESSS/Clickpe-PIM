name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run --frozen --extra dev pytest -q
      - name: Lint
        run: uv run --frozen --extra dev ruff check src app tests scripts
      - name: Replay without live sources
        run: >-
          uv run --frozen --extra dev python -m clickpe_pim run
          --mode replay
          --manifest tests/fixtures/catalogue/replay-manifest.json
          --output-root .artifacts/ci
          --run-id fixture_ci
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: replay-${{ matrix.os }}
          path: .artifacts/ci
          if-no-files-found: warn
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          PIM_UI_DEMO: "1"
      - run: npm run typecheck
      - run: npm run audit:out
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
